<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>teste de formulario</h1>
    <form action="cadastro.php" method="get"
    autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30"
            placeholder="Digite seu nome completo" size="20" autocomplete="name" required>
        </p>

        <p>
            <label for="imedia">Média:</label> 
            <input type="number" name="media" id="imedia"
            placeholder="0 a 10" step="0.1" min="0" max="10" required>
        </p>

        <p>
            <label for="imes">Periodo Letivo</label>
            <input type="month" name="mes" id="imes" required>
        </p>

        <p>
            <label for="idata">Data de Nascimento:</label>
            <input type="date" name="data" id="idata" required>
        </p>
        <label for="ihora">horario da prova:</label>
        <input type="time" name="hora" id="ihora" required>

        <p>
            <input type="submit" value="Enviar">''
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
