<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário:</label>
            <input type="text" name="usu" id="iusu" required minlength="10" maxlength="15" required
            size="15"
            placeholder="Digite seu usuário"
            autocomplete="username">
        </p>
        <p>
            <label for="isen">password:</label>
            <input type="password" name="sen" id="isen" minlength="8" maxlength="20" required
            size="13" placeholder="Digite sua senha"
            autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        
    </form>
</body>
</html>
