<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body {
            font-family: Arial, Helvetica, sans-serif;

        h1 {

</head>
<body>
    
    <form action="cadastro.php" method="get" autocomplete="on">

        <h1 id="1ih1">brincar com os comandos de formulario e etc</h1>
        <h1 id="2ih1">brincar macacos me mordam não</h1>
        <h2 id="1ih2">loucura loucura loucura loucura loucura</h2>
        <h2 id="2ih2">lorem ipsum dolor sit amet lorem ipsum dolor sit amet</h2>

        <p>
            <label for="iano"> em que ano vc naceu?
                <input type="number" name="ano" id="iano" min="1900" max="2026" required
                value="2000" oninput="calcIdade()">
            </label>
        </p>

        <p>
            <label for="iidade">Sua idade é: </label>
            <output id="iidade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
